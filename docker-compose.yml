services:
  mosquitto:
    image: rafaelgasparoto/smartdrain-mosquitto:latest
    build: ./docker/mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"

  hardhat-node:
    image: rafaelgasparoto/smartdrain-contract:latest
    build: ../smartdrain-contract
    ports:
      - "8545:8545"
    volumes:
      - contract_deployments:/app/ignition/deployments
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-X", "POST",
             "-H", "Content-Type: application/json",
             "--data", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}",
             "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: rafaelgasparoto/smartdrain-api:latest
    build: ./
    depends_on:
      hardhat-node:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DEPLOYMENT_PATH: "/contracts/deployments/chain-31337/deployed_addresses.json"
      ARTIFACTS_PATH: "/contracts/deployments/chain-31337/artifacts/ManutencaoBocaDeLoboModule#ManutencaoBocaDeLobo.json"
      ARTIFACT_NAME: "ManutencaoBocaDeLoboModule#ManutencaoBocaDeLobo"
      WEB_SOCKET_PROVIDER_URL: "ws://hardhat-node:8545"
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      TEMPO_LIMITE_VALIDACAO_MS: "60000"
      BROKER_URL: "mqtt://mosquitto:1883"
      TOPICO: "sensor/sinal"
    volumes:
      - contract_deployments:/contracts/deployments:ro
    ports:
      - "3000:3000"

  web:
    image: rafaelgasparoto/smartdrain-web:latest
    build: ../smartdrain-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  contract_deployments:
